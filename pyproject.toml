[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-penalty-agent"
version = "0.1.0"
description = "银行罚单挖掘与合规风险画像 Agent(自研 Harness: PE-R-R + ToT + 异步 HITL + 三级记忆)"
requires-python = ">=3.11"

# 运行依赖以 requirements.txt 为准(设计约定),此处不重复声明;
# 开发安装: pip install -e . -r requirements-dev.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

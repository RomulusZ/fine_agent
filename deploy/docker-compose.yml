# 本项目独立的开发数据库(PostgreSQL + pgvector)
# 端口用 5433,避开本机其他项目可能占用的 5432
services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: bank-penalty-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: penalties
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d penalties"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
